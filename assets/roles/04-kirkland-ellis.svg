  <style>
    .when { font: 500 21px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; letter-spacing: .6px; }
    .role { font: 500 34px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f4f7f6; }
    .where { font: 500 22px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .chip { font: 500 16.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eaf4f5; }
    .pill { fill: #fff; fill-opacity: .09; stroke: #fff; stroke-opacity: .22; }
    .ic { color: #eaf4f5; }
    .gl { animation: gl 22s ease-in-out infinite alternate; }
    @keyframes gl { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
    @media (prefers-reduced-motion: reduce) { .a0, .a1, .a2, .gl { animation: none !important; } }

    @keyframes s0 { to { transform: translateX(-1500.0px); } } .a0 { animation: s0 68.2s linear infinite normal; animation-delay: -6.8s; } @keyframes s1 { to { transform: translateX(-1500.0px); } } .a1 { animation: s1 88.2s linear infinite reverse; animation-delay: -45.9s; } @keyframes s2 { to { transform: translateX(-1500.0px); } } .a2 { animation: s2 55.6s linear infinite normal; animation-delay: -44.4s; }
  </style>

