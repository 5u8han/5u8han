<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="t">
  <title id="t">2022 to 2023: Desktop, Network and Infrastructure Support Analyst at Endeavour Health, Swedish Hospital. The tools used in this role drift by in the background.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a3d"/>
      <stop offset="0.55" stop-color="#3b5772"/>
      <stop offset="1" stop-color="#7f9bb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0b4b8" stop-opacity=".42"/>
      <stop offset="1" stop-color="#f0b4b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050b14" stop-opacity=".34"/>
      <stop offset="1" stop-color="#050b14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".40" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".70" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="190">
      <rect width="1280" height="190" fill="url(#fadeG)"/>
    </mask>
    <clipPath id="card"><rect width="1280" height="190" rx="22"/></clipPath>
    <symbol id="g-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-3.2 2.7-5 5.5-5s5 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.4 1.2 4.9 4"/></g></symbol><symbol id="g-cloud" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18z"/></g></symbol><symbol id="g-mail" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></g></symbol><symbol id="g-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h9M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></g></symbol><symbol id="g-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.2-2.9 7.7-7 9.5-4.1-1.8-7-5.3-7-9.5V6l7-3z"/><path d="M9 12l2 2 4-4"/></g></symbol><symbol id="g-package" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.2v9.6L12 21l-8-4.2V7.2L12 3z"/><path d="M4 7.2l8 4.3 8-4.3M12 11.5V21"/></g></symbol><symbol id="g-network" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M12 7.2v4.3M12 11.5L6.5 16M12 11.5l5.5 4.5"/></g></symbol><symbol id="g-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol><symbol id="g-server" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.5"/><path d="M7 7.25h.01M7 16.75h.01"/></g></symbol><symbol id="g-chart" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5M4 20h16"/><rect x="7.5" y="12" width="3" height="5.5" rx=".6"/><rect x="12.5" y="8" width="3" height="9.5" rx=".6"/><rect x="17.5" y="10.5" width="2" height="7" rx=".6"/></g></symbol><symbol id="g-desk-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10c4-3.2 10-3.2 14 0v2.5l-2.5.8-1-2c-2.2-.9-4.8-.9-7 0l-1 2L5 12.5V10z"/><rect x="5" y="14.5" width="14" height="6" rx="1.5"/></g></symbol>
    <g id="r0"><g transform="translate(0.0,0)"><rect class="pill" width="181.6" height="42" rx="21"/><use class="ic" href="#g-users" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="120.6" lengthAdjust="spacing">Active Directory</text></g><g transform="translate(245.8,0)"><rect class="pill" width="130.1" height="42" rx="21"/><use class="ic" href="#g-cloud" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="69.1" lengthAdjust="spacing">Azure AD</text></g><g transform="translate(440.1,0)"><rect class="pill" width="129.8" height="42" rx="21"/><use class="ic" href="#g-mail" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="68.8" lengthAdjust="spacing">Exchange</text></g><g transform="translate(634.1,0)"><rect class="pill" width="154.9" height="42" rx="21"/><use class="ic" href="#g-sliders" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="93.9" lengthAdjust="spacing">Group Policy</text></g><g transform="translate(853.2,0)"><rect class="pill" width="160.5" height="42" rx="21"/><use class="ic" href="#g-shield" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="99.5" lengthAdjust="spacing">SSO and MFA</text></g><g transform="translate(1077.9,0)"><rect class="pill" width="167.0" height="42" rx="21"/><use class="ic" href="#g-package" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="106.0" lengthAdjust="spacing">SCCM / MECM</text></g><g transform="translate(1309.1,0)"><rect class="pill" width="126.7" height="42" rx="21"/><use class="ic" href="#g-network" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="65.7" lengthAdjust="spacing">PXE boot</text></g></g><g id="r1"><g transform="translate(0.0,0)"><rect class="pill" width="133.2" height="42" rx="21"/><use class="ic" href="#g-lock" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="72.2" lengthAdjust="spacing">BitLocker</text></g><g transform="translate(195.3,0)"><rect class="pill" width="192.1" height="42" rx="21"/><use class="ic" href="#g-server" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="131.1" lengthAdjust="spacing">ESXi and vSphere</text></g><g transform="translate(449.6,0)"><rect class="pill" width="191.8" height="42" rx="21"/><use class="ic" href="#g-server" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="130.8" lengthAdjust="spacing">Citrix XenDesktop</text></g><g transform="translate(703.5,0)"><rect class="pill" width="144.7" height="42" rx="21"/><use class="ic" href="#g-chart" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="83.7" lengthAdjust="spacing">SolarWinds</text></g><g transform="translate(910.3,0)"><rect class="pill" width="150.3" height="42" rx="21"/><use class="ic" href="#g-desk-phone" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="89.3" lengthAdjust="spacing">Cisco CUCM</text></g><g transform="translate(1122.7,0)"><rect class="pill" width="145.0" height="42" rx="21"/><use class="ic" href="#g-lock" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="84.0" lengthAdjust="spacing">AnyConnect</text></g><g transform="translate(1329.8,0)"><rect class="pill" width="108.1" height="42" rx="21"/><use class="ic" href="#g-package" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="47.1" lengthAdjust="spacing">BigFix</text></g></g>
  </defs>
  <style>
    .when { font: 500 19px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; letter-spacing: .5px; }
    .role { font: 500 30px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f4f7f6; }
    .where { font: 500 20px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .chip { font: 500 15.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eaf4f5; }
    .tag { font: 500 13.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .pill { fill: #fff; fill-opacity: .09; stroke: #fff; stroke-opacity: .22; }
    .ic { color: #eaf4f5; }
    .gl { animation: gl 22s ease-in-out infinite alternate; }
    @keyframes gl { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
    @media (prefers-reduced-motion: reduce) { .a0, .a1, .gl { animation: none !important; } }

    @keyframes s0 { to { transform: translateX(-1500.0px); } } .a0 { animation: s0 68.2s linear infinite normal; animation-delay: -6.8s; } @keyframes s1 { to { transform: translateX(-1500.0px); } } .a1 { animation: s1 55.6s linear infinite reverse; animation-delay: -34.4s; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="190" fill="url(#bg)"/>
    <ellipse class="gl" cx="1010" cy="60" rx="420" ry="190" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <g transform="translate(0,34)"><g class="a0"><use href="#r0"/><use href="#r0" x="1500.0"/></g></g><g transform="translate(0,106)"><g class="a1"><use href="#r1"/><use href="#r1" x="1500.0"/></g></g>
    </g>
    <rect width="760" height="190" fill="url(#scrim)"/>
    <text class="when" x="64" y="48" fill="#f3cfd0">2022 – 2023</text>
    
    <text class="role"><tspan x="64" y="88">Desktop, Network &amp;</tspan><tspan x="64" y="124">Infrastructure Support Analyst</tspan></text>
    <text class="where" x="64" y="162" fill="#f8e1e1">Endeavour Health, Swedish Hospital</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="189" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
</svg>
