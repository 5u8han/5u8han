" x="48" y="28.5" textLength="76.9" lengthAdjust="spacing">BitLocker</text></g><g transform="translate(711.7,0)"><rect class="pill" width="207.6" height="46" rx="23"/><use class="ic" href="#g-server" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="139.6" lengthAdjust="spacing">ESXi and vSphere</text></g><g transform="translate(1002.0,0)"><rect class="pill" width="207.3" height="46" rx="23"/><use class="ic" href="#g-server" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="139.3" lengthAdjust="spacing">Citrix XenDesktop</text></g><g transform="translate(1291.9,0)"><rect class="pill" width="125.4" height="46" rx="23"/><use class="ic" href="#g-server" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="57.4" lengthAdjust="spacing">XenApp</text></g></g><g id="r2"><g transform="translate(0.0,0)"><rect class="pill" width="157.1" height="46" rx="23"/><use class="ic" href="#g-chart" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="89.1" lengthAdjust="spacing">SolarWinds</text></g><g transform="translate(240.8,0)"><rect class="pill" width="200.7" height="46" rx="23"/><use class="ic" href="#g-cpu" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="132.7" lengthAdjust="spacing">iDRAC, iLO, IPMI</text></g><g transform="translate(525.2,0)"><rect class="pill" width="163.0" height="46" rx="23"/><use class="ic" href="#g-desk-phone" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="95.0" lengthAdjust="spacing">Cisco CUCM</text></g><g transform="translate(771.9,0)"><rect class="pill" width="157.4" height="46" rx="23"/><use class="ic" href="#g-lock" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="89.4" lengthAdjust="spacing">AnyConnect</text></g><g transform="translate(1013.1,0)"><rect class="pill" width="118.2" height="46" rx="23"/><use clas