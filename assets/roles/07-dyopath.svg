43" y="26.5" textLength="44.0" lengthAdjust="spacing">SCCM</text></g><g transform="translate(160.8,0)"><rect class="pill" width="185.0" height="42" rx="21"/><use class="ic" href="#g-server" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="124.0" lengthAdjust="spacing">VMware Horizon</text></g><g transform="translate(401.6,0)"><rect class="pill" width="180.0" height="42" rx="21"/><use class="ic" href="#g-mail" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="119.0" lengthAdjust="spacing">Exchange Online</text></g><g transform="translate(637.4,0)"><rect class="pill" width="133.2" height="42" rx="21"/><use class="ic" href="#g-lock" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="72.2" lengthAdjust="spacing">BitLocker</text></g><g transform="translate(826.4,0)"><rect class="pill" width="190.3" height="42" rx="21"/><use class="ic" href="#g-lock" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="129.3" lengthAdjust="spacing">Cisco AnyConnect</text></g><g transform="translate(1072.4,0)"><rect class="pill" width="132.9" height="42" rx="21"/><use class="ic" href="#g-shield" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="71.9" lengthAdjust="spacing">SonicWall</text></g><g transform="translate(1261.1,0)"><rect class="pill" width="183.1" height="42" rx="21"/><use class="ic" href="#g-users" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="122.1" lengthAdjust="spacing">Team leadership</text></g></g>
  </defs>
  <style>
    .when { font: 500 19px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; letter-spacing: .5px; }
    .role { font: 500 30px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f4f7f6; }
    .where { font: 500 20px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .chip { font: 500 15.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eaf4f5; }
    .tag { font: 500 13.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .pill { fill: #fff; fill-opacity: .09; stroke: #fff; stroke-opacity: .22; }
    .ic { color: #eaf4f5; }
    .gl { animation: gl 22s ease-in-out infinite alternate; }
    @keyframes gl { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
    @media (prefers-reduced-motion: reduce) { .a0, .a1, .gl { animation: none !important; } }

    @keyframes s0 { to { transform: translateX(-1500.0px); } } .a0 { animation: s0 68.2s linear infinite normal; animation-delay: -6.8s; } @keyframes s1 { to { transform: translateX(-1500.0px); } } .a1 { animation: s1 55.6s linear infinite reverse; animation-delay: -34.4s; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="190" fill="url(#bg)"/>
    <ellipse class="gl" cx="1010" cy="60" rx="420" ry="190" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <g transform="translate(0,34)"><g class="a0"><use href="#r0"/><use href="#r0" x="1500.0"/></g></g><g transform="translate(0,106)"><g class="a1"><use href="#r1"/><use href="#r1" x="1500.0"/></g></g>
    </g>
    <rect width="760" height="190" fill="url(#scrim)"/>
    <text class="when" x="64" y="48" fill="#cdeeff">2021 – 2022</text>
    
    <text class="role"><tspan x="64" y="88">Service Desk Analyst 3 &amp;</tspan><tspan x="64" y="124">Team Lead</tspan></text>
    <text class="where" x="64" y="162" fill="#dff3ff">DyoPath LP (MSP), remote</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="189" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
