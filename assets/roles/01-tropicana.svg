    <ellipse class="gl" cx="1010" cy="60" rx="420" ry="190" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <g transform="translate(0,34)"><g class="a0"><use href="#r0"/><use href="#r0" x="1500.0"/></g></g><g transform="translate(0,106)"><g class="a1"><use href="#r1"/><use href="#r1" x="1500.0"/></g></g>
    </g>
    <rect width="760" height="190" fill="url(#scrim)"/>
    <text class="when" x="64" y="48" fill="#f2c79b">2025 – now</text>
    <g transform="translate(190.4,29)"><rect width="78.0" height="26" rx="13" fill="none" stroke="#f2c79b" stroke-opacity=".65"/><text class="tag" x="12" y="17.5" textLength="54.0" lengthAdjust="spacing" fill="#f2c79b">Contract</text></g>
    <text class="role"><tspan x="64" y="88">Senior Desktop Support /</tspan><tspan x="64" y="124">Support Engineer</tspan></text>
    <text class="where" x="64" y="162" fill="#bfe3e1">Tropicana Brands Group</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="189" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
