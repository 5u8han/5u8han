<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="t">
  <title id="t">2024 to 2025: Support Engineer at Robinhood, contract. The tools used in this role drift by in the background.</title>
