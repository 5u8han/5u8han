<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 250" width="1280" height="250" role="img" aria-labelledby="t">
  <title id="t">2024 to 2025: Support Engineer at Robinhood. The tools used in this role drift by in the background.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
