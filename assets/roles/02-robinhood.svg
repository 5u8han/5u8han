    <ellipse class="gl" cx="1010" cy="70" rx="420" ry="210" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <g transform="translate(0,32)"><g class="a0"><use href="#r0"/><use href="#r0" x="1500.0"/></g></g><g transform="translate(0,102)"><g class="a1"><use href="#r1"/><use href="#r1" x="1500.0"/></g></g><g transform="translate(0,172)"><g class="a2"><use href="#r2"/><use href="#r2" x="1500.0"/></g></g>
    </g>
    <rect width="760" height="250" fill="url(#scrim)"/>
    <text class="when" x="64" y="80" fill="#bff0d2">2024 – 2025</text>
    <text class="role"><tspan x="64" y="124">Support Engineer</tspan></text>
    <text class="where" x="64" y="172" fill="#d8f3e8">Robinhood</text>
