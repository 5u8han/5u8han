<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="t">
  <title id="t">2018 to now: Desktop Support, per diem, at Chicago Lab Services Inc., a full-time infrastructure build that became on-call support. The tools used in this role drift by in the background.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12282a"/>
      <stop offset="0.55" stop-color="#225b55"/>
      <stop offset="1" stop-color="#6bb3a0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fe3c6" stop-opacity=".42"/>
      <stop offset="1" stop-color="#9fe3c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050b14" stop-opacity=".34"/>
      <stop offset="1" stop-color="#050b14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset=".40" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".70" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="190">
      <rect width="1280" height="190" fill="url(#fadeG)"/>
    </mask>
    <clipPath id="card"><rect width="1280" height="190" rx="22"/></clipPath>
    <symbol id="g-server" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13.5" width="17" height="6.5" rx="1.5"/><path d="M7 7.25h.01M7 16.75h.01"/></g></symbol><symbol id="g-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-3.2 2.7-5 5.5-5s5 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.6-.3 4.4 1.2 4.9 4"/></g></symbol><symbol id="g-sliders" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h8M18 7h2M4 12h2M12 12h8M4 17h9M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></g></symbol><symbol id="g-desk-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 10c4-3.2 10-3.2 14 0v2.5l-2.5.8-1-2c-2.2-.9-4.8-.9-7 0l-1 2L5 12.5V10z"/><rect x="5" y="14.5" width="14" height="6" rx="1.5"/></g></symbol><symbol id="g-shield" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.2-2.9 7.7-7 9.5-4.1-1.8-7-5.3-7-9.5V6l7-3z"/><path d="M9 12l2 2 4-4"/></g></symbol><symbol id="g-network" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5.5" cy="18" r="2.2"/><circle cx="18.5" cy="18" r="2.2"/><path d="M12 7.2v4.3M12 11.5L6.5 16M12 11.5l5.5 4.5"/></g></symbol><symbol id="g-cable" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v4M16 3v4M6 7h12v4a6 6 0 0 1-12 0V7z"/><path d="M12 17v4"/></g></symbol><symbol id="g-video" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12.5" height="12" rx="2"/><path d="M15.5 10.5L21 7.5v9l-5.5-3z"/></g></symbol><symbol id="g-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.3 3.5 8.5s-1 6-3.5 8.5C9.5 18 8.5 15.2 8.5 12s1-6 3.5-8.5z"/></g></symbol><symbol id="g-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3V4.5z"/><path d="M8 17h10"/></g></symbol>
    <g id="r0"><g transform="translate(0.0,0)"><rect class="pill" width="224.1" height="42" rx="21"/><use class="ic" href="#g-server" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="163.1" lengthAdjust="spacing">Windows Server 2019</text></g><g transform="translate(326.8,0)"><rect class="pill" width="181.6" height="42" rx="21"/><use class="ic" href="#g-users" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="120.6" lengthAdjust="spacing">Active Directory</text></g><g transform="translate(611.1,0)"><rect class="pill" width="154.9" height="42" rx="21"/><use class="ic" href="#g-sliders" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="93.9" lengthAdjust="spacing">Group Policy</text></g><g transform="translate(868.7,0)"><rect class="pill" width="90.5" height="42" rx="21"/><use class="ic" href="#g-desk-phone" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="29.4" lengthAdjust="spacing">3CX</text></g><g transform="translate(1061.9,0)"><rect class="pill" width="114.6" height="42" rx="21"/><use class="ic" href="#g-desk-phone" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="53.6" lengthAdjust="spacing">Yealink</text></g><g transform="translate(1279.2,0)"><rect class="pill" width="118.0" height="42" rx="21"/><use class="ic" href="#g-shield" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="57.0" lengthAdjust="spacing">pfSense</text></g></g><g id="r1"><g transform="translate(0.0,0)"><rect class="pill" width="174.2" height="42" rx="21"/><use class="ic" href="#g-network" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="113.2" lengthAdjust="spacing">VLANs and PoE</text></g><g transform="translate(226.4,0)"><rect class="pill" width="169.5" height="42" rx="21"/><use class="ic" href="#g-cable" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="108.5" lengthAdjust="spacing">Cat5e and Cat6</text></g><g transform="translate(448.2,0)"><rect class="pill" width="198.3" height="42" rx="21"/><use class="ic" href="#g-server" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="137.3" lengthAdjust="spacing">Racks and servers</text></g><g transform="translate(698.8,0)"><rect class="pill" width="191.5" height="42" rx="21"/><use class="ic" href="#g-video" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="130.5" lengthAdjust="spacing">Security cameras</text></g><g transform="translate(942.6,0)"><rect class="pill" width="109.7" height="42" rx="21"/><use class="ic" href="#g-globe" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="48.7" lengthAdjust="spacing">Drupal</text></g><g transform="translate(1104.5,0)"><rect class="pill" width="114.6" height="42" rx="21"/><use class="ic" href="#g-shield" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="53.6" lengthAdjust="spacing">McAfee</text></g><g transform="translate(1271.4,0)"><rect class="pill" width="176.3" height="42" rx="21"/><use class="ic" href="#g-book" x="14" y="11" width="20" height="20"/><text class="chip" x="43" y="26.5" textLength="115.3" lengthAdjust="spacing">Wolters Kluwer</text></g></g>
  </defs>
  <style>
    .when { font: 500 19px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; letter-spacing: .5px; }
    .role { font: 500 30px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f4f7f6; }
    .where { font: 500 20px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .chip { font: 500 15.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eaf4f5; }
    .tag { font: 500 13.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .pill { fill: #fff; fill-opacity: .09; stroke: #fff; stroke-opacity: .22; }
    .ic { color: #eaf4f5; }
    .gl { animation: gl 22s ease-in-out infinite alternate; }
    @keyframes gl { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
    @media (prefers-reduced-motion: reduce) { .a0, .a1, .gl { animation: none !important; } }

    @keyframes s0 { to { transform: translateX(-1500.0px); } } .a0 { animation: s0 68.2s linear infinite normal; animation-delay: -6.8s; } @keyframes s1 { to { transform: translateX(-1500.0px); } } .a1 { animation: s1 55.6s linear infinite reverse; animation-delay: -34.4s; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="190" fill="url(#bg)"/>
    <ellipse class="gl" cx="1010" cy="60" rx="420" ry="190" fill="url(#glow)"/>
    <g mask="url(#fade)">
      <g transform="translate(0,34)"><g class="a0"><use href="#r0"/><use href="#r0" x="1500.0"/></g></g><g transform="translate(0,106)"><g class="a1"><use href="#r1"/><use href="#r1" x="1500.0"/></g></g>
    </g>
    <rect width="760" height="190" fill="url(#scrim)"/>
    <text class="when" x="64" y="64" fill="#d9f6e6">2018 – now</text>
    <g transform="translate(190.4,45)"><rect width="196.8" height="26" rx="13" fill="none" stroke="#d9f6e6" stroke-opacity=".65"/><text class="tag" x="12" y="17.5" textLength="172.8" lengthAdjust="spacing" fill="#d9f6e6">Full-time build, then on-call</text></g>
    <text class="role"><tspan x="64" y="104">Desktop Support (per diem)</tspan></text>
    <text class="where" x="64" y="142" fill="#e6faf0">Chicago Lab Services Inc.</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="189" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
</svg>
