text class="chip" x="48" y="28.5" textLength="120.5" lengthAdjust="spacing">VLANs and PoE</text></g><g transform="translate(548.5,0)"><rect class="pill" width="183.5" height="46" rx="23"/><use class="ic" href="#g-cable" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="115.5" lengthAdjust="spacing">Cat5e and Cat6</text></g><g transform="translate(847.6,0)"><rect class="pill" width="214.2" height="46" rx="23"/><use class="ic" href="#g-server" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="146.2" lengthAdjust="spacing">Racks and servers</text></g><g transform="translate(1177.4,0)"><rect class="pill" width="206.9" height="46" rx="23"/><use class="ic" href="#g-video" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="138.9" lengthAdjust="spacing">Security cameras</text></g></g><g id="r2"><g transform="translate(0.0,0)"><rect class="pill" width="119.8" height="46" rx="23"/><use class="ic" href="#g-globe" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="51.8" lengthAdjust="spacing">Drupal</text></g><g transform="translate(177.9,0)"><rect class="pill" width="153.8" height="46" rx="23"/><use class="ic" href="#g-globe" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="85.8" lengthAdjust="spacing">SiteGround</text></g><g transform="translate(389.8,0)"><rect class="pill" width="125.1" height="46" rx="23"/><use class="ic" href="#g-shield" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="57.1" lengthAdjust="spacing">McAfee</text></g><g transform="translate(572.9,0)"><rect class="pill" width="190.8" height="46" rx="23"/><use class="ic" href="#g-book" x="16" y="12" width="22" height="22"/><text class="chip" x="48" y="28.5" textLength="122.8" lengthAdjust="spacing">Wolters Kluwer</text></g><g transform="translate(821.8,0)"><rect class="pill" width="125.1" height="46" rx="