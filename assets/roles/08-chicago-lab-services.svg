    <text class="when" x="64" y="80" fill="#d9f6e6">2018 – now</text>
    <g transform="translate(204.2,59)"><rect width="211.6" height="28" rx="14" fill="none" stroke="#d9f6e6" stroke-opacity=".65"/><text class="tag" x="13" y="19" textLength="185.6" lengthAdjust="spacing" fill="#d9f6e6">Full-time build, then on-call</text></g>
    <text class="role"><tspan x="64" y="124">Desktop Support (per diem)</tspan></text>
    <text class="where" x="64" y="172" fill="#e6faf0">Chicago Lab Services Inc.</text>
  </g>
  <rect x=".5" y=".5" width="1279" height="249" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
