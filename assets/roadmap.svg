<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480" role="img" aria-labelledby="t d">
  <title id="t">The road ahead: macOS, Windows and Linux lanes flowing into hybrid and cloud, toward systems administration</title>
  <desc id="d">Three lanes show what is done so far and what comes next for macOS, Windows and Linux. They merge into hybrid and cloud architecture and then into a sunrise labeled systems administrator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e1b2e"/>
      <stop offset="0.6" stop-color="#18344f"/>
      <stop offset="1" stop-color="#335d7a"/>
    </linearGradient>
    <radialGradient id="dawn" cx="1218" cy="240" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dcb4" stop-opacity=".62"/>
      <stop offset=".3" stop-color="#eaa98f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#eaa98f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6dcb4" stop-opacity=".6"/>
      <stop offset="1" stop-color="#f6dcb4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="480" rx="22"/></clipPath>
  </defs>
  <style>
    .lane { font: 600 20px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; }
    .nt { font: 600 16px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eef3f1; }
    .nd { font: 400 13.5px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #a9bfcb; }
    .small { font: 400 13px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #8fa8b6; }
    .lake1 { font: 600 16px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f3f6f4; }
    .lake2 { font: 400 13px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #c1d3db; }
    .dest { font: 600 15px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #fff7e6; }
    .destd { font: 400 13px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #f1dcc4; }
    .flow { stroke-dasharray: 1 16; stroke-linecap: round; animation: flow 3s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -34; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 3.6s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.8); opacity: .75; } 100% { transform: scale(2.1); opacity: 0; } }
    .sun { animation: breathe 7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { from { transform: scale(.94); opacity: .7; } to { transform: scale(1.08); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse, .sun { animation: none !important; } }
</style>

  <g clip-path="url(#card)">
    <rect width="1280" height="480" fill="url(#bg)"/>
    <rect width="1280" height="480" fill="url(#dawn)"/>

    <path d="M665,62 L665,420" stroke="#fff" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="4 7"/>
    <text class="small" x="665" y="46" text-anchor="middle">today</text>

    <path d="M150,120 L800,120 C880,120 880,240 946,240" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="14" stroke-linecap="round"/><path d="M150,240 L946,240" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="14" stroke-linecap="round"/><path d="M150,360 L800,360 C880,360 880,240 946,240" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="14" stroke-linecap="round"/>
    <path d="M150,120 L575,120" stroke="#b9c2ff" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/><path d="M150,240 L575,240" stroke="#86d8e6" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/><path d="M150,360 L575,360" stroke="#f0cf95" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>
    <path class="flow" d="M150,120 L800,120 C880,120 880,240 946,240" fill="none" stroke="#b9c2ff" stroke-opacity=".85" stroke-width="3"/><path class="flow" d="M150,240 L946,240" fill="none" stroke="#86d8e6" stroke-opacity=".85" stroke-width="3"/><path class="flow" d="M150,360 L800,360 C880,360 880,240 946,240" fill="none" stroke="#f0cf95" stroke-opacity=".85" stroke-width="3"/>

    <ellipse cx="1050" cy="240" rx="108" ry="94" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".2"/>
    <text class="lake1" x="1050" y="234" text-anchor="middle">Hybrid and cloud</text>
    <text class="lake2" x="1050" y="256" text-anchor="middle">Azure, GCP, Cloudflare</text>
    <text class="lake2" x="1050" y="274" text-anchor="middle">ESXi, Proxmox, Hyper-V</text>

    <path d="M1158,240 L1218,240" stroke="#f6dcb4" stroke-opacity=".7" stroke-width="3" class="flow" fill="none"/>
    <circle class="sun" cx="1218" cy="240" r="62" fill="url(#halo)"/>
    <circle cx="1218" cy="240" r="13" fill="#f8e2bd" stroke="#fff7e6" stroke-width="2"/>
    <text class="dest" x="1218" y="188" text-anchor="middle">Systems</text>
    <text class="dest" x="1218" y="206" text-anchor="middle">administrator</text>
    <text class="destd" x="1218" y="282" text-anchor="middle">macOS, Windows</text>
    <text class="destd" x="1218" y="299" text-anchor="middle">and Linux</text>

    <circle cx="215" cy="120" r="9" fill="#b9c2ff" stroke="#0e1b2e" stroke-width="3"/><circle cx="395" cy="120" r="9" fill="#b9c2ff" stroke="#0e1b2e" stroke-width="3"/><circle cx="575" cy="120" r="9" fill="#b9c2ff" stroke="#0e1b2e" stroke-width="3"/><circle class="pulse" cx="755" cy="120" r="10" fill="none" stroke="#b9c2ff" stroke-width="2"/><circle cx="755" cy="120" r="10" fill="#0e1b2e" stroke="#b9c2ff" stroke-width="3"/><circle cx="215" cy="240" r="9" fill="#86d8e6" stroke="#0e1b2e" stroke-width="3"/><circle cx="395" cy="240" r="9" fill="#86d8e6" stroke="#0e1b2e" stroke-width="3"/><circle cx="575" cy="240" r="9" fill="#86d8e6" stroke="#0e1b2e" stroke-width="3"/><circle class="pulse" cx="755" cy="240" r="10" fill="none" stroke="#86d8e6" stroke-width="2"/><circle cx="755" cy="240" r="10" fill="#0e1b2e" stroke="#86d8e6" stroke-width="3"/><circle cx="215" cy="360" r="9" fill="#f0cf95" stroke="#0e1b2e" stroke-width="3"/><circle cx="395" cy="360" r="9" fill="#f0cf95" stroke="#0e1b2e" stroke-width="3"/><circle cx="575" cy="360" r="9" fill="#f0cf95" stroke="#0e1b2e" stroke-width="3"/><circle class="pulse" cx="755" cy="360" r="10" fill="none" stroke="#f0cf95" stroke-width="2"/><circle cx="755" cy="360" r="10" fill="#0e1b2e" stroke="#f0cf95" stroke-width="3"/>
    <text class="lane" x="28" y="86" fill="#b9c2ff">macOS</text><text class="nt" x="215" y="86" text-anchor="middle">macOS support</text><text class="nd" x="215" y="105" text-anchor="middle">desktop and executive</text><text class="nt" x="395" y="86" text-anchor="middle">JAMF Pro and ABM</text><text class="nd" x="395" y="105" text-anchor="middle">zero-touch deployment</text><text class="nt" x="575" y="86" text-anchor="middle">FleetDM and Okta</text><text class="nd" x="575" y="105" text-anchor="middle">compliance, MFA, YubiKey</text><text class="nt" x="755" y="86" text-anchor="middle" fill="#b9c2ff" style="fill:#b9c2ff">Own the Mac fleet</text><text class="nd" x="755" y="105" text-anchor="middle">baselines and patching</text><text class="lane" x="28" y="206" fill="#86d8e6">Windows</text><text class="nt" x="215" y="206" text-anchor="middle">Active Directory</text><text class="nd" x="215" y="225" text-anchor="middle">GPO, Exchange, Azure AD</text><text class="nt" x="395" y="206" text-anchor="middle">SCCM, PXE, Intune</text><text class="nd" x="395" y="225" text-anchor="middle">imaging and deployment</text><text class="nt" x="575" y="206" text-anchor="middle">Windows Server labs</text><text class="nd" x="575" y="225" text-anchor="middle">AD, DNS, IIS (2019, 2025)</text><text class="nt" x="755" y="206" text-anchor="middle" fill="#86d8e6" style="fill:#86d8e6">Servers and hybrid ID</text><text class="nd" x="755" y="225" text-anchor="middle">Entra ID with on-prem AD</text><text class="lane" x="28" y="326" fill="#f0cf95">Linux</text><text class="nt" x="215" y="326" text-anchor="middle">Linux fundamentals</text><text class="nd" x="215" y="345" text-anchor="middle">RHEL, CentOS, Debian</text><text class="nt" x="395" y="326" text-anchor="middle">Arch daily driver</text><text class="nd" x="395" y="345" text-anchor="middle">btw, I use Arch</text><text class="nt" x="575" y="326" text-anchor="middle">Virtualization lab</text><text class="nd" x="575" y="345" text-anchor="middle">Proxmox, KVM, LXC, ZFS</text><text class="nt" x="755" y="326" text-anchor="middle" fill="#f0cf95" style="fill:#f0cf95">Production Linux</text><text class="nd" x="755" y="345" text-anchor="middle">patching, hardening, K8s</text>

    <circle cx="36" cy="450" r="6" fill="#cfe0ea" stroke="#0e1b2e" stroke-width="2"/>
    <text class="small" x="50" y="454.5">where I've been</text>
    <circle cx="190" cy="450" r="6" fill="#0e1b2e" stroke="#cfe0ea" stroke-width="2"/>
    <text class="small" x="204" y="454.5">where I'm heading</text>
  </g>
</svg>
