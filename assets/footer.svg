<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 200" width="1280" height="200" role="img" aria-labelledby="t d">
  <title id="t">Thanks for stopping by</title>
  <desc id="d">A quiet lake at night with a crescent moon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d192b"/>
      <stop offset="1" stop-color="#244260"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5b75"/>
      <stop offset="1" stop-color="#10233a"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="1010" cy="54" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3e6c8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f3e6c8" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect x="960" y="10" width="100" height="90" fill="#fff"/>
      <circle cx="1019" cy="48" r="19" fill="#000"/>
    </mask>
    <clipPath id="card"><rect width="1280" height="200" rx="22"/></clipPath>
  </defs>
  <style>
    .l1 { font: 400 30px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #eef3f1; letter-spacing: 0.3px; }
    .l2 { font: 400 18px "Avenir Next", "Segoe UI", "SF Pro Text", "Helvetica Neue", Inter, "DM Sans", "Open Sans", Arial, sans-serif; fill: #b7cad3; }
    .wave { animation: drift linear infinite; }
    .w1 { animation-name: d1; animation-duration: 28s; }
    .w2 { animation-name: d2; animation-duration: 38s; animation-direction: reverse; }
    .w3 { animation-name: d3; animation-duration: 50s; }
    @keyframes d1 { to { transform: translateX(-110px); } }
    @keyframes d2 { to { transform: translateX(-190px); } }
    @keyframes d3 { to { transform: translateX(-300px); } }
    .star { animation: tw 7s ease-in-out infinite; }
    @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) {
      .wave, .star { animation: none !important; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="200" fill="url(#sky)"/>
    <circle class="star" cx="140" cy="40" r="1.3" fill="#f4efe3" opacity="0.6" style="animation-delay:0.5s"/>
    <circle class="star" cx="260" cy="92" r="1.0" fill="#f4efe3" opacity="0.45" style="animation-delay:2.2s"/>
    <circle class="star" cx="360" cy="30" r="1.5" fill="#f4efe3" opacity="0.7" style="animation-delay:1.1s"/>
    <circle class="star" cx="470" cy="70" r="1.0" fill="#f4efe3" opacity="0.45" style="animation-delay:3.4s"/>
    <circle class="star" cx="560" cy="24" r="1.2" fill="#f4efe3" opacity="0.6" style="animation-delay:0.2s"/>
    <circle class="star" cx="730" cy="28" r="1.2" fill="#f4efe3" opacity="0.55" style="animation-delay:2.6s"/>
    <circle class="star" cx="820" cy="66" r="1.0" fill="#f4efe3" opacity="0.45" style="animation-delay:1.4s"/>
    <circle class="star" cx="905" cy="30" r="1.5" fill="#f4efe3" opacity="0.7" style="animation-delay:3.1s"/>
    <circle class="star" cx="1130" cy="38" r="1.2" fill="#f4efe3" opacity="0.6" style="animation-delay:0.9s"/>
    <circle class="star" cx="1200" cy="88" r="1.0" fill="#f4efe3" opacity="0.45" style="animation-delay:2.0s"/>
    <circle class="star" cx="80" cy="110" r="1.0" fill="#f4efe3" opacity="0.4" style="animation-delay:3.7s"/>
    <circle class="star" cx="1240" cy="30" r="1.3" fill="#f4efe3" opacity="0.55" style="animation-delay:1.7s"/>
    <circle cx="1010" cy="54" r="90" fill="url(#moonglow)"/>
    <circle cx="1010" cy="54" r="26" fill="#f3e6c8" mask="url(#crescent)"/>

    <rect y="150" width="1280" height="50" fill="url(#water)"/>
    <path class="wave w1" d="M-110.0,156 Q-82.5,150.0 -55.0,156 Q-27.5,162.0 0.0,156 Q27.5,150.0 55.0,156 Q82.5,162.0 110.0,156 Q137.5,150.0 165.0,156 Q192.5,162.0 220.0,156 Q247.5,150.0 275.0,156 Q302.5,162.0 330.0,156 Q357.5,150.0 385.0,156 Q412.5,162.0 440.0,156 Q467.5,150.0 495.0,156 Q522.5,162.0 550.0,156 Q577.5,150.0 605.0,156 Q632.5,162.0 660.0,156 Q687.5,150.0 715.0,156 Q742.5,162.0 770.0,156 Q797.5,150.0 825.0,156 Q852.5,162.0 880.0,156 Q907.5,150.0 935.0,156 Q962.5,162.0 990.0,156 Q1017.5,150.0 1045.0,156 Q1072.5,162.0 1100.0,156 Q1127.5,150.0 1155.0,156 Q1182.5,162.0 1210.0,156 Q1237.5,150.0 1265.0,156 Q1292.5,162.0 1320.0,156 Q1347.5,150.0 1375.0,156 Q1402.5,162.0 1430.0,156 Q1457.5,150.0 1485.0,156 Q1512.5,162.0 1540.0,156 L1540.0,220 L-110.0,220 Z" fill="#a9d3dc" fill-opacity="0.12" stroke="#d6ecef" stroke-opacity="0.26" stroke-width="1.2"/>
  <path class="wave w2" d="M-190.0,169 Q-142.5,160.0 -95.0,169 Q-47.5,178.0 0.0,169 Q47.5,160.0 95.0,169 Q142.5,178.0 190.0,169 Q237.5,160.0 285.0,169 Q332.5,178.0 380.0,169 Q427.5,160.0 475.0,169 Q522.5,178.0 570.0,169 Q617.5,160.0 665.0,169 Q712.5,178.0 760.0,169 Q807.5,160.0 855.0,169 Q902.5,178.0 950.0,169 Q997.5,160.0 1045.0,169 Q1092.5,178.0 1140.0,169 Q1187.5,160.0 1235.0,169 Q1282.5,178.0 1330.0,169 Q1377.5,160.0 1425.0,169 Q1472.5,178.0 1520.0,169 Q1567.5,160.0 1615.0,169 Q1662.5,178.0 1710.0,169 L1710.0,220 L-190.0,220 Z" fill="#2a5c76" fill-opacity="0.62" stroke="#d6ecef" stroke-opacity="0.2" stroke-width="1.2"/>
  <path class="wave w3" d="M-300.0,184 Q-225.0,172.0 -150.0,184 Q-75.0,196.0 0.0,184 Q75.0,172.0 150.0,184 Q225.0,196.0 300.0,184 Q375.0,172.0 450.0,184 Q525.0,196.0 600.0,184 Q675.0,172.0 750.0,184 Q825.0,196.0 900.0,184 Q975.0,172.0 1050.0,184 Q1125.0,196.0 1200.0,184 Q1275.0,172.0 1350.0,184 Q1425.0,196.0 1500.0,184 Q1575.0,172.0 1650.0,184 Q1725.0,196.0 1800.0,184 Q1875.0,172.0 1950.0,184 L1950.0,220 L-300.0,220 Z" fill="#173a52" fill-opacity="0.88" stroke="#d6ecef" stroke-opacity="0.16" stroke-width="1.2"/>

    <text class="l1" x="640" y="82" text-anchor="middle">Thanks for stopping by.</text>
    <text class="l2" x="640" y="116" text-anchor="middle">Take a breath, drink some water, have a good one.</text>
  </g>
</svg>
