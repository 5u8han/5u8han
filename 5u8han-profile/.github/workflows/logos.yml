name: Add logos to role wallpapers

# Pulls brand logos from the Simple Icons package (CC0) and re-renders the
# animated role wallpapers in assets/roles. Anything it cannot find keeps the
# neutral icon, so the page always looks complete.
#
# Runs automatically when scripts/build_assets.py changes (including the first
# push) and can be started by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_assets.py"
      - ".github/workflows/logos.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Simple Icons
        run: npm install --no-save simple-icons

      - name: Rebuild SVG assets with real logos
        run: python3 scripts/build_assets.py --icons node_modules/simple-icons/icons

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild role wallpapers with logos"
            git push
          fi
